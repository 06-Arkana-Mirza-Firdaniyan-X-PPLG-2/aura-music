<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="discBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="groove" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24242e"/>
      <stop offset="60%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="8" fill="url(#discBg)"/>
  
  <!-- Outer Grooves / Vinyl Effect -->
  <circle cx="64" cy="64" r="50" fill="url(#groove)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="41" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="64" cy="64" r="23" fill="#181820" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Center Minimalist Acoustic Soundwaves -->
  <rect x="52" y="58" width="3" height="12" rx="1.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="58" y="52" width="3" height="24" rx="1.5" fill="#ffffff"/>
  <rect x="64" y="47" width="3" height="34" rx="1.5" fill="#ffffff"/>
  <rect x="70" y="54" width="3" height="20" rx="1.5" fill="#ffffff"/>
  <rect x="76" y="60" width="3" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.8"/>
</svg>
